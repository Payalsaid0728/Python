
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px #00000015;
        }

        h1 {
            color: #273c75;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 7px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #273c75;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #192a56;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .section {
            margin-top: 25px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .note {
            color: #666;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Forgot Password?</h1>

        <p class="description">
            Reset your password securely using a PIN sent to your email.
        </p>

        <form id="forgotForm">
            <label for="email">Registered Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >

            <button type="submit" id="sendButton">
                Send Reset PIN
            </button>
        </form>

        <div class="section">
            <h3>Reset Your Password</h3>

            <form id="resetForm">
                <label for="pin">Six-Digit PIN</label>

                <input
                    type="text"
                    id="pin"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    placeholder="Enter PIN from email"
                    required
                >

                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    maxlength="128"
                    placeholder="Enter your new password"
                    required
                >

                <button type="submit" id="resetButton">
                    Reset Password
                </button>
            </form>
        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="note">
            Never share your PIN or password with anyone.
        </p>

    </div>

    <script>
        const message = document.getElementById("message");

        async function callApi(url, data) {
            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "Request failed.");
            }

            return result;
        }

        document.getElementById("forgotForm")
            .addEventListener("submit", async function (event) {
                event.preventDefault();

                const button = document.getElementById("sendButton");
                button.disabled = true;
                message.textContent = "Sending reset PIN email...";

                try {
                    const result = await callApi("/api/password/forgot", {email: document.getElementById("email").value});
                    message.textContent = result.message;
                } catch (error) {
                    message.textContent = "Error: " + error.message;
                } finally {
                    button.disabled = false;
                }
            });

        document.getElementById("resetForm")
            .addEventListener("submit", async function (event) {
                event.preventDefault();

                const button = document.getElementById("resetButton");
                button.disabled = true;
                message.textContent = "Updating your password...";

                try {

                    let data= {
                            email: document.getElementById("email").value,
                            pin: document.getElementById("pin").value,
                            new_password: document.getElementById("newPassword").value
                        }
                    const result = await callApi("/api/password/reset",data);

                    message.textContent = result.message;
                    document.getElementById("resetForm").reset();
                } catch (error) {
                    message.textContent = "Error: " + error.message;
                } finally {
                    button.disabled = false;
                }
            });
    </script>
</body>
</html>
